<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EURUS — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-body:       #080b15;
      --cyan:          #00d4ff;
      --cyan-glow:     rgba(0, 212, 255, 0.15);
      --green:         #00e676;
      --text-primary:  #e4e8f0;
      --text-secondary:#8895b3;
      --text-muted:    #7e8ba8;
      --font-display:  'Syne', sans-serif;
      --font-body:     'Outfit', sans-serif;
      --radius:        20px;
      --radius-sm:     10px;
    }
    html { scroll-behavior: smooth; }

    .skip-link {
      position: absolute; top: -100%; left: 8px; z-index: 10000;
      background: var(--cyan); color: var(--bg-body);
      font-family: var(--font-body); font-weight: 600;
      padding: 10px 20px;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      text-decoration: none; transition: top 0.2s ease;
    }
    .skip-link:focus { top: 0; }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .btn-google:focus-visible {
      box-shadow: 0 0 0 2px var(--cyan);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }

    body {
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 212, 255, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 100%, rgba(0, 212, 255, 0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-box {
      background: #111728;
      border: 1px solid #1e2845;
      border-radius: var(--radius);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
      padding: 44px 32px 40px;
      width: 100%;
      max-width: 390px;
      margin: 16px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .logo-wrap { margin-bottom: 20px; }
    .logo-wrap img { height: 40px; opacity: 0.9; margin-bottom: 12px; }
    .logo-wrap p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 28px 0 20px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e2845;
    }
    .divider span { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      border: 1.5px solid #1e2845;
      border-radius: var(--radius-sm);
      background: transparent;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      min-height: 52px;
    }
    .btn-google:hover {
      border-color: var(--cyan);
      background: rgba(0, 212, 255, 0.06);
    }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.4; cursor: not-allowed; }
    .alerta {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: left;
      line-height: 1.4;
    }
    .alerta.show { display: block; }
    .alerta-error { background: rgba(255, 23, 68, 0.12); color: #ff1744; border-left: 4px solid #ff1744; }
    .alerta-aviso { background: rgba(0, 212, 255, 0.08); color: var(--cyan); border-left: 4px solid var(--cyan); }
    .nota {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      line-height: 1.6;
    }
    .nota strong { color: var(--cyan); }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <main id="main-content">
    <div class="login-box">
      <div class="logo-wrap">
        <img src="icons/logoEurusblanco.png" alt="EURUS"/>
        <p>Portal de Inscripciones y Certificados</p>
      </div>

      <div class="alerta alerta-error" id="msg-error" role="alert"></div>
      <div class="alerta alerta-aviso" id="msg-aviso" role="alert"></div>

      <div class="divider" role="separator" aria-orientation="horizontal"><span>Inicia sesión con tu cuenta</span></div>

      <button class="btn-google" id="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48" style="flex-shrink:0">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <p class="nota">Acceso exclusivo para coordinadores de <strong>EURUS</strong>.<br>Si eres nuevo, un administrador debe activar tu acceso.</p>
    </div>
  </main>

  <script type="module">
    import { loginConGoogle, guardRoute } from "./js/auth.js";

    guardRoute();

    const btn      = document.getElementById("btn-google");
    const msgError = document.getElementById("msg-error");
    const msgAviso = document.getElementById("msg-aviso");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.childNodes[1].textContent = " Conectando...";
      msgError.classList.remove("show");
      msgAviso.classList.remove("show");

      try {
        await loginConGoogle();
        const rol = sessionStorage.getItem("rol");

        if (rol === "sin_rol") {
          msgAviso.textContent = "✅ Tu cuenta fue registrada. Cuando un administrador te asigne el rol EURUS, entrarás automáticamente.";
          msgAviso.classList.add("show");
          btn.disabled = false;
          btn.childNodes[1].textContent = " Continuar con Google";

          const uid = sessionStorage.getItem("uid");
          if (uid) {
            const { db } = await import("./js/firebase-config.js");
            const { doc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js");
            onSnapshot(doc(db, "usuarios", uid), (snap) => {
              if (!snap.exists()) return;
              const nuevoRol = snap.data().rol || "sin_rol";
              if (nuevoRol !== "sin_rol") {
                sessionStorage.setItem("rol", nuevoRol);
                window.location.href = "dashboard.html";
              }
            });
          }
          return;
        }

        window.location.href = "dashboard.html";

      } catch (e) {
        btn.disabled = false;
        btn.childNodes[1].textContent = " Continuar con Google";
        if (e.code === "auth/popup-closed-by-user") return;
        if (e.code === "auth/popup-blocked") {
          msgError.textContent = "⚠️ El navegador bloqueó la ventana emergente. Permite popups para este sitio e intenta de nuevo.";
        } else if (e.code === "auth/unauthorized-domain") {
          msgError.textContent = "⚠️ Firebase no tiene autorizado este dominio. Agrégalo en Firebase Console > Authentication > Settings > Authorized domains.";
        } else {
          msgError.textContent = "❌ Error al iniciar sesión. Intenta de nuevo.";
        }
        msgError.classList.add("show");
      }
    });
  </script>
</body>
</html>
